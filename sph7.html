<script>
const DATA=JSON.parse(document.getElementById('ranking-data').textContent); let axis='haneRank';
const $=id=>document.getElementById(id); const fmt=v=>v==null?'—':Number(v).toFixed(2).replace(/\.00$/,'');
function match(row) { const q=$('search').value.trim().toLocaleLowerCase(); return (!q||row.title.toLocaleLowerCase().includes(q)) && (row.haneScore||0)>=Number($('minHane').value||0) && (row.zureScore||0)>=Number($('minZure').value||0) && (!$('unseen').checked||row.datasetStatus==='unseen'); }
function details(row) { const fields={"HANE U1 raw":"HANE_U1_raw","ZURE S1 raw":"ZURE_S1_raw","H0 events":"H0_events","H1 events":"H1_events","Stable evidence":"stableEvidence","Variable evidence":"variableEvidence","HANE explainability":"haneExplainability","Stable soft":"stableSoftEvidence","Physical IOI dominant ratio":"offgridPhysicalIoiDominantRatio","Physical IOI entropy":"offgridPhysicalIoiEntropy"}; return Object.entries(fields).map(([label,key])=>`<dt>${label}</dt><dd>${fmt(row[key])}</dd>`).join(''); }
function render() { const rows=DATA.filter(match).sort((a,b)=>a[axis]-b[axis]); $('count').textContent=`${rows.length} / ${DATA.length} charts`; $('list').innerHTML=rows.map(row=>`<article class="card"><h2>${row.displayTitle||row.title}${row.isNew?'<span class="known">今回追加</span>':''}${row.datasetStatus!=='unseen'?'<span class="known">KNOWN</span>':''}</h2><div class="scores"><div class="score hane"><b>HANE #${row.haneRank}</b><strong>${fmt(row.haneScore)}</strong></div><div class="score zure"><b>ZURE #${row.zureRank}</b><strong>${fmt(row.zureScore)}</strong></div></div><div class="meta">v${row.version} · ${row.totalEvents} events</div><details class="details"><summary>詳細</summary><dl>${details(row)}</dl><a class="link" href="${row.textageUrl}" target="_blank" rel="noopener">TEXTAGEで見る</a></details></article>`).join(''); }
function setAxis(next,button) { axis=next; $('haneTab').classList.toggle('active',button==='hane'); $('zureTab').classList.toggle('active',button==='zure'); render(); }
$('haneTab').onclick=()=>setAxis('haneRank','hane'); $('zureTab').onclick=()=>setAxis('zureRank','zure'); ['search','minHane','minZure','unseen'].forEach(id=>$(id).addEventListener('input',render)); render();
</script></body></html>
